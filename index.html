<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Clima</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Clima</h1>
    <form class="busca">
        <input type="search" id="searchInput"/>
        <button>Buscar</button>
        <div class="aviso"></div>
 

    <div class="resultado">
        <div class="titulo">--</div>

        <div class="info">
            <div class="temp">
                <div class="tempTitulo">Temperatura</div>
                <div class="tempInfo">-- <sup>C</sup></div>
                <img src="https://openweathermap.org/img/wn/10d@2x.png">
            </div>
            <div class="vento">
                <div class="ventoTiulo">Vento</div>
                <div class="ventoInfo">-- <span>km/h</span></div>
                <div class="ventoArea">
                    <div class="ventoPonto" style="transform: rotate(0deg);"></div>
                </div>
            </div>
        </div>
    </div>
       </form>
<script src="/js/script.js"></script>
</body>
</html>
